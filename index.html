<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spero Call Flow</title>
<style>
:root{--ink:#211d17;--paper:#faf8f2;--line:#ddd5c2;--accent:#c9622c;--muted:#7a7060;--panel:#f1ece0;--good:#2f7d4f;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ede8dc;--paper:#171512;--line:#3a352c;--accent:#e88a4c;--muted:#a89d88;--panel:#211d17;--good:#6fcf97;--onacc:#171512}}
:root[data-theme="dark"]{--ink:#ede8dc;--paper:#171512;--line:#3a352c;--accent:#e88a4c;--muted:#a89d88;--panel:#211d17;--good:#6fcf97;--onacc:#171512}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 40px}
header{padding:14px 0 8px}
h1{font-size:1.25rem;margin:0}
.sub{color:var(--muted);font-size:.8rem;margin:2px 0 0}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
#tabs button.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
h2{font-size:1.1rem;margin:18px 0 4px}
.note{color:var(--muted);font-size:.83rem;margin:0 0 12px}
.step{background:var(--panel);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;margin:9px 0}
.step .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:2px}
.step p{margin:0;font-family:Georgia,serif;font-size:1.03rem}
.step.ok{border-left-color:var(--good)}.step.ok .tag{color:var(--good)}
.tip{font-size:.83rem;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--panel)}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel);overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:.93rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.2rem;line-height:1}
details[open] summary::after{content:"\2212"}
details[open] summary{border-bottom:1px solid var(--line)}
details .a{padding:4px 14px 12px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.9rem;font-weight:600;cursor:pointer}
.pager button.next{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.pager button:disabled{opacity:.3}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.branch button{padding:12px 8px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:.85rem;cursor:pointer}
.branch button.on{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Spero Call Flow</h1><p class="sub">Michael Tettey · tap a step, tap a line, keep talking</p></header>
<div id="tabs"></div>
<main id="view"></main>
</div>
<script>
var say=function(tag,text,ok){return {k:'s',tag:tag,text:text,ok:ok}};
var qa=function(q,a,tag){return {k:'q',q:q,a:a,tag:tag||'You say'}};
var tip=function(t){return {k:'t',text:t}};
var S=[
{id:'gk',tab:'1 Gatekeeper',title:'Gatekeeper',note:'When they ask what you do, answer in ONE plain sentence, then hand the question back. Tap what they say.',items:[
 say('First ask','"Hi, this is Michael Tettey with Spero. Is [Name] available?"'),
 qa('"What is this regarding?" / "What do you do?" / "What is Spero?"','"Spero is a staffing company. We provide trained remote sales reps who book meetings for sales teams. I just have a quick question for [Name] about their outbound. Is he/she the right person for that?"'),
 qa('"Is [Name] expecting your call?"','"No, this is a cold call and I\'ll be brief. Is [Name] around, or is there a better time to catch them?"'),
 qa('"Send an email" / "We don\'t take sales calls"','"Happy to. So it lands with the right person, who handles sales development or outbound? ... And the best email for them? ... When are they usually free for a short call, mornings or afternoons?"'),
 qa('"They\'re not available" / "In a meeting"','"No problem. When\'s the best time to reach them? I\'ll leave my direct line, 385-402-7875. Who am I speaking with, so I can mention you?"'),
 qa('"Wrong person" / "That\'s not our department"','"Thanks for telling me. Who handles sales development or outbound prospecting there? ... Can I get their name and email?"'),
 tip('Always get: the gatekeeper\'s name, the right person\'s name and title, a best time, and a direct email or line.')
]},
{id:'op',tab:'2 Opener',title:'Opener (prospect picks up)',note:'Confirm, introduce, give the reason in one line, ask permission. Only then go to discovery.',items:[
 say('A · Confirm','"Hi, is this [Name]?"'),
 say('B · Intro + cold-call frame','"Hi [Name], this is Michael Tettey from Spero. I know I\'m calling out of the blue, so I\'ll be quick."'),
 say('C · Reason for the call','"We provide trained remote sales reps who book qualified meetings for sales teams, and I\'m calling to see if outbound is something you\'re working on right now."',true),
 say('D · Permission','"Can I ask you two quick questions to see if this is even relevant?"'),
 tip('If they ask "what\'s this about?" at any point, jump straight to step C. If they say go ahead, go to Discovery.')
]},
{id:'di',tab:'3 Discovery',title:'Discovery',note:'Bridge first so the question feels natural. One question at a time, then listen.',items:[
 say('Bridge','"Great. The reason I ask is that most sales leaders I speak with are stretched on pipeline."'),
 say('Q1','"How are you currently generating most of your leads: inbound, outbound, referrals, or a mix?"'),
 say('Q2 · decides your pitch','"Do you have an internal team booking meetings for you, or reps making outbound calls?"',true),
 say('Q3','"Is filling your AEs\' pipelines with qualified meetings a priority right now?"'),
 tip('Has a team, go to Pitch A. No team, go to Pitch B. Not sure? Ask "who handles outbound today?"')
]},
{id:'pi',tab:'4 Pitch',title:'Pitch',note:'Pick the one that matches their Q2 answer.',branch:true,items:[]},
{id:'cl',tab:'5 Close',title:'Close',note:'Micro-commitment: 15 minutes with your AE.',items:[
 say('Ask','"I\'m not trying to sell you anything on this call. I\'d like to set up a quick 15-minute conversation with my Account Executive, who\'ll learn your process and show you how it works. Tomorrow, or would Thursday work better?"'),
 say('Lock it in','"I\'ll send an invite for [Day] at [Time]. You can reschedule if anything comes up. What\'s the best email for it?"',true)
]},
{id:'ob',tab:'6 Objections',title:'Objections',note:'Tap what they said.',items:[
 qa('"Send me an email"','"Sure. So it\'s useful and not noise, what would you want to see? Also, a 15-minute call with our AE shows exactly how it runs. Would [Day] at [Time] work?"'),
 qa('"Not interested"','"Totally fair. Is that timing, or is adding outbound support just not a priority? I\'ll send a short email and follow up next week to see if it made sense."'),
 qa('"We already have SDRs / we outsource"','"That\'s great. Are they keeping your reps\' calendars full? Some teams use us for overflow at a fraction of the cost. Worth 15 minutes to compare?"'),
 qa('"What does it cost?"','"The Test Drive starts at $4 an hour for the first two months. The AE goes through full pricing based on how many reps you\'d need. Can we get 15 minutes on [Day]?"'),
 qa('"No budget / bad timing"','"Understood. That\'s why the Test Drive exists: low cost, no long-term commitment. Can I check back in a few weeks?"')
]},
{id:'vm',tab:'7 Voicemail',title:'Voicemail (under 20 seconds)',note:'Speak clearly with energy. Rotate; never the same one twice in a row.',items:[
 say('First touch','"Hi [Name], Michael Tettey from Spero. We provide trained remote sales reps who book meetings for sales teams, and we just launched a Test Drive at $4 an hour for the first two months. If outbound is on your radar, call me at 385-402-7875. Thanks."'),
 say('Follow-up','"Hey [Name], Michael from Spero again. Following up on my last message about filling your pipeline with qualified meetings. I\'m at 385-402-7875."'),
 say('Later touch','"Hey [Name], this is Michael Tettey with Spero. I understand you\'ve been busy, but I want to see if we could have a quick call this week regarding your outbound sales process and how we could help you fill your pipeline with quality appointments with our cost-effective SDR program. My number is 385-402-7875."')
]}
];
var PITCH={a:['Pitch A · has a team','"We just launched a Talent Test Drive Program: trained remote SDRs from Latin America for as little as $4 an hour for the first two months, so you can see the fit before any long-term commitment. We handle recruiting and training, and you manage them like any remote team member. Does that sound relevant?"'],
b:['Pitch B · no team','"We help companies fill their pipeline with qualified, pre-scheduled appointments that match their ideal client profile, at a fraction of the cost of hiring an SDR in the U.S. Our reps prospect, qualify, and book the meetings; your AEs just show up and sell."']};
var cur=0,pit='a';
try{var sv=parseInt(localStorage.getItem('spero_tab'),10);if(sv>=0&&sv<S.length)cur=sv;}catch(e){}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 var t=document.getElementById('tabs');
 t.innerHTML=S.map(function(s,i){return '<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+s.tab+'</button>'}).join('');
 var s=S[cur],h='<h2>'+s.title+'</h2><p class="note">'+s.note+'</p>';
 if(s.branch){
  h+='<div class="branch"><button data-p="a" class="'+(pit==='a'?'on':'')+'">Has a team<br>Pitch A</button><button data-p="b" class="'+(pit==='b'?'on':'')+'">No team<br>Pitch B</button></div>';
  h+='<div class="step ok"><div class="tag">'+PITCH[pit][0]+'</div><p>'+esc(PITCH[pit][1])+'</p></div>';
 }
 s.items.forEach(function(it){
  if(it.k==='s')h+='<div class="step'+(it.ok?' ok':'')+'"><div class="tag">'+it.tag+'</div><p>'+esc(it.text)+'</p></div>';
  else if(it.k==='q')h+='<details><summary>'+esc(it.q)+'</summary><div class="a"><div class="step ok" style="margin:6px 0"><div class="tag">'+it.tag+'</div><p>'+esc(it.a)+'</p></div></div></details>';
  else h+='<div class="tip">'+esc(it.text)+'</div>';
 });
 h+='<div class="pager"><button data-n="-1" '+(cur===0?'disabled':'')+'>Back</button><button class="next" data-n="1" '+(cur===S.length-1?'disabled':'')+'>Next: '+(S[cur+1]?S[cur+1].title.split(' (')[0]:'')+'</button></div>';
 document.getElementById('view').innerHTML=h;
 var on=t.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
 try{localStorage.setItem('spero_tab',cur)}catch(e){}
}
function go(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.i!==undefined)go(+b.dataset.i);
 else if(b.dataset.n!==undefined)go(cur+ +b.dataset.n);
 else if(b.dataset.p){pit=b.dataset.p;render()}
});
render();
</script>
</body>
</html>
