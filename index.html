<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDR Call Assistant</title>
<style>
:root{color-scheme:dark;--bg:#090a0b;--panel:#141618;--border:#2c3034;--text:#f5f6f7;--muted:#9ca3af;--green:#22c55e;--blue:#60a5fa;--red:#f87171;--fill:#fde68a;--fill-bg:#3b2f0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1280px;margin:auto;padding:14px max(14px,env(safe-area-inset-left)) 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{font-size:19px;font-weight:750}.brand span{color:var(--green)}
.keys{font-size:12px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:14px}
kbd{border:1px solid #3a3f44;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;color:#d1d5db}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:14px;align-items:start}
main{display:grid;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1px solid #374151;border-radius:20px;padding:3px 11px;color:#cbd5e1;font-size:13px;font-weight:700;white-space:nowrap}
.pill.medicare{border-color:#1d4ed8;background:#0d1b3a;color:#93c5fd}
.pill.aca{border-color:#166534;background:#052e16;color:#86efac}
.pill.dq{border-color:#991b1b;background:#2a0d0d;color:#fca5a5}
.progress{height:4px;background:#2b2e31;border-radius:4px;margin:10px 0 12px;overflow:hidden}
.progress>div{height:100%;background:var(--green);transition:width .2s}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:800;letter-spacing:.04em;font-size:18px}
.banner.medicare{background:#0d1b3a;border:1px solid #1d4ed8;color:#93c5fd}
.banner.aca{background:#052e16;border:1px solid #166534;color:#86efac}
.banner.dq{background:#2a0d0d;border:1px solid #991b1b;color:#fca5a5}
.banner small{display:block;font-weight:500;letter-spacing:0;font-size:14px;opacity:.9}
h1{font-size:22px;line-height:1.25;margin:0 0 10px}
.script{font-size:23px;line-height:1.6;background:#0c0e0f;border:1px solid #262a2d;border-radius:12px;padding:18px 20px;margin:8px 0}
.fill{color:var(--fill);background:var(--fill-bg);border-radius:5px;padding:0 .2em;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid #383b40;background:#24272a;color:#fff;border-radius:10px;padding:12px 14px;text-align:left;min-height:52px;display:flex;align-items:center;gap:10px}
.btn:hover{background:#32363a}
.btn .n{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#0005;display:grid;place-items:center;font-size:12px;font-weight:700;color:#cbd5e1}
.btn.primary{background:#e7e9eb;color:#111;border-color:#e7e9eb;font-weight:650}
.btn.primary .n{background:#0001;color:#111}
.btn.bad{border-color:#7f1d1d}
.btn.wide{grid-column:1/-1}
.toolbar{display:flex;gap:8px;margin-top:12px}
.toolbar .btn{min-height:40px;padding:7px 12px;font-size:14px;background:transparent;justify-content:center}
.toolbar .btn.flash{background:#14532d;border-color:#22c55e;color:#bbf7d0}
.btn:disabled{opacity:.4;cursor:default}
.card.rb .script{border-color:#2f6b47;background:#0f2017}
.card.rb #heading{color:#86efac}
.card.dqc .script{border-color:#7f1d1d;background:#1c0b0b}
.state-card{display:flex;align-items:center;gap:14px;padding:12px 16px}
.state-card label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:700;white-space:nowrap}
#stateCode{width:72px;flex:0 0 72px;border:1px solid #41454a;background:#0b0d0e;color:#fff;padding:8px;border-radius:10px;text-align:center;text-transform:uppercase;font-weight:700;font-size:18px}
#stateName{font-size:20px;font-weight:700;min-width:0}
#stateName.dim{font-size:14px;font-weight:400;color:var(--muted)}
/* objections */
.obj-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;border:1px solid #41454a;background:#0b0d0e;color:#fff;padding:9px 11px;border-radius:10px;min-width:0}
.objections{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.objections .btn{font-size:14px;min-height:46px;padding:9px 11px;line-height:1.25}
.objections .btn.on{background:#14532d;border-color:#22c55e}
.response{border:1px solid #2f6b47;background:#0f2017;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.response .say{font-size:20px;line-height:1.5;margin:6px 0 0}
.response .pivot{margin-top:12px;padding-top:10px;border-top:1px dashed #2f6b47;font-weight:650;color:#bbf7d0}
.response .flag{margin-top:10px;color:#fca5a5;font-weight:700;font-size:14px}
.response .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.hidden{display:none!important}
@media(max-width:820px){.grid{grid-template-columns:1fr}.script{font-size:20px}aside{order:-1}}
@media(max-width:420px){.choices,.objections{grid-template-columns:1fr}.btn.wide{grid-column:auto}.keys{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">🎧 SDR <span>Call Assistant</span></div>
    <div class="top-right">
      <div class="keys"><kbd>1</kbd>–<kbd>6</kbd> answer · <kbd>Backspace</kbd> back · <kbd>/</kbd> objections · <kbd>Esc</kbd> close</div>
    </div>
  </header>

  <div class="grid">
    <main>
     <section class="card" id="stepCard">
      <div class="row"><span class="eyebrow" id="stage"></span><span class="pill" id="path">Undetermined</span></div>
      <div class="progress"><div id="bar"></div></div>
      <div class="banner hidden" id="banner"></div>
      <h1 id="heading"></h1>
      <div class="eyebrow">Say to customer</div>
      <div class="script" id="script" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
      <div class="choices" id="choices"></div>
      <div class="toolbar">
        <button class="btn" id="back">← Back</button>
        <button class="btn" id="restart">↻ New call</button>
      </div>
     </section>
     <section class="card state-card">
      <label for="stateCode">State</label>
      <input id="stateCode" maxlength="2" placeholder="TX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <output id="stateName" class="dim" aria-live="polite">Type a 2-letter abbreviation</output>
     </section>
    </main>

    <aside class="card">
      <div id="rebuttal" class="response hidden" aria-live="polite">
        <div class="row"><span class="eyebrow" id="rbTitle"></span><button class="x" id="closeRebuttal" aria-label="Close">×</button></div>
        <p class="say" id="rbSay"></p>
        <div class="flag hidden" id="rbFlag"></div>
        <div class="pivot" id="rbPivot"></div>
      </div>
      <div class="obj-head">
        <input class="search" id="search" type="search" placeholder="Objection… (press /)" aria-label="Search objections" autocomplete="off">
      </div>
      <div class="objections" id="objections"></div>
    </aside>
  </div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let current='opening',history=[],answers={};
const v=x=>typeof x==='function'?x(answers):x;
const LIVE_TAIL=' It’s NOW open enrollment for 2027! We NEED to make sure your coverage is taken care of and, MOST IMPORTANTLY, have a licensed insurance agent review the NEW 2027 plans to let you know what benefits are now available. Just a few quick questions to verify your information for your free review.';
const LIVE_OUT='Hi [Customer Name]! [Agent Name] here with Health Advisors on a recorded line!'+LIVE_TAIL;
const LIVE_IN='Thank you for calling in! This is [Agent Name] here with Health Advisors on a recorded line!'+LIVE_TAIL;

/* Choice format: [label, next, answersToSet?, style?]
   next can be a node id or a function(answers) returning one.
   answersToSet.dq = disqualification reason (routes to the DQ close). */
const DNC=['Do not call','dnc',null,'bad'];
const nodes={
// ---------- Shared opening ----------
opening:{step:1,title:'Opening · Outbound',say:LIVE_OUT,hint:'Pause and let them respond.',
  choices:[['Willing to continue','identity'],['Inbound call instead','openingIn'],['Not interested','notInterested'],['Busy','rbBusy'],['Wrong person','rbWrongPerson'],DNC]},
openingIn:{step:1,title:'Opening · Inbound',say:LIVE_IN,hint:'Customer called in.',
  choices:[['Continue','identity'],['Not interested','notInterested'],DNC]},
identity:{step:2,title:'Verify name',say:'And can you please verify your first and last name for me.',hint:'Update the name in ConvoSo and save.',
  choices:[['Name verified','age'],['Not interested','notInterested'],['Already has insurance','rbInsured'],['Won’t give name','rbIdentity'],DNC]},
age:{step:3,title:'Age',say:'Now, I know you sound young, but I do have to ask, are you under the age of 65?',hint:'',
  choices:[['Under 65','medicareQ',{age:'Under 65'}],['65 or older','medicareQ',{age:'65 or older'}],['Won’t say','clarifyAge']]},
medicareQ:{step:4,title:'Medicare Parts A & B',say:'Do you have Medicare Parts A & B?',hint:'Yes → Medicare path. No + under 65 → ACA path. No + 65 or older → not qualified.',
  choices:[
    ['Yes, A and B',a=>a.age==='Under 65'?'u65Dis':'card',{path:'Medicare',medicare:'Parts A and B'}],
    ['No Medicare',a=>a.age==='65 or older'?'dq':'medicaid',a=>a.age==='65 or older'?{medicare:'No',dq:'65+ with no Medicare A & B'}:{path:'ACA',medicare:'No'}],
    ['Only one part','dq',{medicare:'One part only',dq:'Does not have both Parts A and B'},'bad'],
    ['Not sure','card',{path:'Medicare',medicare:'Unsure'}]]},

// ---------- Medicare path ----------
card:{step:5,title:'Medicare card',say:'Just to make sure you have the red, white, and blue Medicare card that says Hospital Part A and Medical Part B, right? It’s okay if you don’t have it on you right now. We just need to confirm you have it.',hint:'Say “Medicare card”, not “Medicaid card”. No card = not qualified.',
  choices:[['Has the card',a=>a.age==='Under 65'?'u65Dis':'mName2',{card:'Yes'}],['No card','dq',{card:'No',dq:'No Medicare card'},'bad']]},
u65Dis:{step:5,title:'Under 65 · Disability & Medicaid',say:'Are you also receiving disability benefits and Medicaid?',hint:'Under-65 Medicare needs YES to BOTH. Missing either = not qualified.',
  choices:[['Yes, both','mTransfer',{disabilityMedicaid:'Both'}],['Only one / neither','dq',{disabilityMedicaid:'Not both',dq:'Under 65: needs both disability benefits and Medicaid'},'bad']]},
mName2:{step:6,title:'Confirm name',say:'Can you please confirm your first and last name?',hint:'Update ConvoSo if needed.',
  choices:[['Confirmed','mEmployer'],['Won’t give name','rbIdentity']]},
mEmployer:{step:6,title:'Employer or union',say:'Do you have insurance coverage through an Employer or Union?',hint:'Yes = not qualified.',
  choices:[['No','mVA',{employer:'No'}],['Yes','dq',{employer:'Yes',dq:'Employer or union coverage'},'bad']]},
mVA:{step:7,title:'VA or TRICARE',say:'Okay, and how about coverage through the VA or TRICARE program?',hint:'Yes = transfer to the VA/TRICARE accepted campaign. No = continue.',
  choices:[['No','mMeds',{va:'No'}],['Yes — VA/TRICARE campaign','mTransfer',{va:'Yes',campaign:'VA/TRICARE'}]]},
mMeds:{step:8,title:'Medications',say:'Yes or no is fine for this question. Do you currently take eight or more medications, including over the counter?',hint:'Enter YES or NO in ConvoSo. The answer does not affect qualification.',
  choices:[['Yes','mTransfer',{meds:'Yes'}],['No','mTransfer',{meds:'No'}]]},
mTransfer:{step:9,title:'Medicare · Transfer permission',banner:true,say:'Okay, great! It looks like you may qualify for multiple Medicare plans based on your ZIP code. I would like to transfer you to a licensed insurance agent who can review your plan options. Do I have your permission to transfer you now to a licensed insurance agent?',hint:'Say “Medicare plans”, not “medical plans”. Wait for a clear yes.',
  choices:[['Yes — transfer','transition',{consent:'Yes'}],['No','rbTransfer']]},

// ---------- ACA path ----------
medicaid:{step:5,title:'Medicaid',say:'And you are not currently on Medicaid, right?',hint:'On Medicaid = not qualified.',
  choices:[['Correct, not on Medicaid','aOther',{medicaid:'No'}],['On Medicaid','dq',{medicaid:'Yes',dq:'On Medicaid'},'bad']]},
aOther:{step:6,title:'Other insurance',say:'Do you have insurance coverage through an employer, union, VA, or TRICARE?',hint:'Yes = not qualified.',
  choices:[['No','aState',{other:'No'}],['Yes','dq',{other:'Yes',dq:'Employer, union, VA or TRICARE coverage'},'bad']]},
aState:{step:7,title:'State',say:'You’re still living in [State], correct?',hint:'Type the state in the box below. Wait for their answer before asking ZIP.',
  choices:[['Yes','aZip',{state:'Confirmed'}],['Moved — updated in ConvoSo','aZip',{state:'Updated'}],['Won’t confirm','rbLocation']]},
aZip:{step:8,title:'ZIP code',say:'Okay, great, and is your ZIP code still [ZIP Code]?',hint:'Read the ZIP from ConvoSo. Update it if incorrect.',
  choices:[['Yes','aTransfer',{zip:'Confirmed'}],['Updated in ConvoSo','aTransfer',{zip:'Updated'}],['Won’t confirm','rbLocation']]},
aTransfer:{step:9,title:'ACA · Transfer permission',banner:true,say:'Okay, great! It looks like you may qualify for multiple ACA plans based on your ZIP code. I would like to transfer you to a licensed insurance agent who can review your plan options with you. Do I have your permission to transfer you now?',hint:'Say “A-C-A” clearly, all three letters. Wait for a clear yes.',
  choices:[['Yes — transfer','transition',{consent:'Yes'}],['No','rbTransfer']]},

// ---------- Transfer ----------
transition:{step:10,title:'Bring the agent on',banner:true,say:'Alright, I’m bringing them on the line now. They’ll be a big help and let you know what you may qualify for. Please stay on the line with me.',
  hint:a=>'HOLD: stay on hold until the licensed agent answers. Transfer button: '+(a.campaign?'the VA/TRICARE accepted campaign':'Medicare DS 1 - PDM Inhouse ACA Medicare DS 1')+'. Small talk while waiting: “How is your day going so far?” · “Any plans for the upcoming weekend?” · “How is the weather where you are?”',
  choices:[['Agent joined','handoff'],['No agent available','transferUnavailable']]},
handoff:{step:10,title:'Warm transfer',banner:true,say:'Hi, I have [Customer Name] on the line with me from the state of [State]. Can you please help them from here?',hint:'Stick to the scripted handoff only. Once the agent and lead are speaking, leave the transfer line.',
  choices:[['Call completed','done']]},
transferUnavailable:{step:10,title:'Transfer unavailable',say:'I’m sorry, an agent isn’t available to join right now. What time would be more convenient for us to call you back?',hint:'',
  choices:[['End call','done']]},

// ---------- Decline rebuttals (one try, then close) ----------
notInterested:{step:2,rb:true,title:'Rebuttal · Not interested',say:'I understand, [Customer Name]. Before you decide, let’s just make sure you’re not overlooking an option available to you. This is very helpful and won’t take long.',hint:'If still not interested, close politely.',
  choices:[['Agrees to continue',()=>history.some(h=>h.current==='identity')?'age':'identity'],['Still declines','end'],DNC]},
rbInsured:{step:2,rb:true,title:'Rebuttal · Already has insurance',say:'Perfect! Most people we speak with do. We’re simply checking whether there are other options or benefits you may qualify for.',hint:'',
  choices:[['Continue','age'],['Still declines','end'],DNC]},
rbBusy:{step:1,rb:true,title:'Rebuttal · Busy',say:'Absolutely — I’ll keep it quick. Let’s just check the basics and see whether it’s worth continuing.',hint:'If still busy, offer a callback time.',
  choices:[['Agrees','identity'],['Call back later','callback'],['Still declines','end'],DNC]},
rbWrongPerson:{step:1,rb:true,title:'Rebuttal · Wrong person',say:'That happens to me too! But since I have you on the line, let me quickly see what coverage options you might qualify for.',hint:'',
  choices:[['Agrees','identity'],['Still declines','end'],DNC]},
rbIdentity:{step:2,rb:true,title:'Rebuttal · Won’t give name',say:'I completely understand, and you don’t have to share anything you’re not comfortable with. I just need to make sure I’m speaking with the right person before we go over anything. Could you confirm your first and last name for me?',hint:'If still declines, close politely.',
  choices:[['Name verified',a=>a.card?'mEmployer':'age'],['Still declines','end'],DNC]},
clarifyAge:{step:3,rb:true,title:'Rebuttal · Won’t give age',say:'Good question. Medicare benefits mostly start at 65, and the plans you can qualify for depend on your age. I just need to confirm it so I’m checking the right things for you. Are you under or over 65?',hint:'',
  choices:[['Under 65','medicareQ',{age:'Under 65'}],['65 or older','medicareQ',{age:'65 or older'}],['Still declines','end']]},
rbLocation:{step:7,rb:true,title:'Rebuttal · Won’t confirm location',say:'I understand. Plans and benefits are different in every state and ZIP code, so I just need to confirm yours to make sure I’m checking the right ones for you. What state and ZIP code are you in?',hint:'',
  choices:[['Confirmed','aTransfer',{location:'Confirmed'}],['Still declines','end'],DNC]},
rbTransfer:{step:10,rb:true,title:'Rebuttal · Won’t transfer',say:'I understand. The licensed agent just walks you through what’s available — there’s no obligation, and you don’t have to change anything. It only takes a few minutes, and you decide what makes sense. Is it okay if I bring them on the line?',hint:'Only transfer on a clear yes.',
  choices:[['Yes — transfer','transition',{consent:'Yes'}],['Still declines','end',{consent:'No'}],DNC]},

// ---------- Closes ----------
dq:{step:10,dqc:true,title:'Not qualified · Close',say:'Unfortunately, it looks like you don’t qualify at this time. Thank you for taking my call and have a great day!',hint:'Disposition as not qualified in ConvoSo.',
  choices:[['Finish call','done']]},
callback:{step:10,title:'Callback',say:'Of course. What time would be more convenient for you?',hint:'Set the callback in ConvoSo.',choices:[['Callback set','done'],['Declines','end']]},
end:{step:10,title:'Customer declines',say:'No problem. Thank you for your time, and have a good day.',hint:'',choices:[['Finish call','done']]},
dnc:{step:10,title:'Do not call',say:'Understood. I’ll follow the required do-not-call procedure. Have a good day.',hint:'Mark DNC in ConvoSo now. Do not continue the conversation.',choices:[['Finish call','done']]},
done:{step:10,title:'Call finished',say:'Call complete.',hint:'',choices:[['Start a new call','RESET']]}
};

const PIVOT='“So, could you confirm your first and last name for me?”';
const objections=[
 {t:'Not interested',s:'I understand, [Customer Name]. Before you decide, let’s just make sure you’re not overlooking an option available to you. This is very helpful and won’t take long.'},
 {t:'Already have insurance',s:'Perfect — most people we speak with do. We’re simply checking whether there are other options or benefits you may qualify for.'},
 {t:'Happy with my insurance',s:'That’s great! There’s no need to change something that works. Let’s simply check whether anything else may be available.'},
 {t:'Don’t want to change my plan',s:'And you don’t have to change anything, [Customer Name]. We’re simply reviewing what options may be available. You decide what makes sense for you.'},
 {t:'I’m busy',s:'Absolutely — I’ll keep it quick. Let’s just check the basics and see whether it’s worth continuing.'},
 {t:'Call me back',s:'Of course. What time would be more convenient for you?',pivot:'Set the callback in ConvoSo.'},
 {t:'Too many calls',s:'I understand — I get them too. Give me a moment to explain why I called, and you can decide whether it’s relevant.'},
 {t:'Already did this',s:'Perfect, [Customer Name] — then you already know how quick this is. I just want to make sure nothing available to you was missed. Let’s verify a couple things.'},
 {t:'Is this a scam?',s:'Fair question. Don’t provide anything you’re uncomfortable sharing. I’m calling to help review health coverage options you may qualify for.'},
 {t:'How did you get my number?',s:'That’s a fair question. I can explain the source of your contact information once I’ve verified it.',pivot:'Only mention a prior form or call if ConvoSo records confirm it. Then: '+PIVOT},
 {t:'Who are you?',s:'I’m [Agent Name] with Health Advisors. I’m calling to help review health coverage options you may qualify for.'},
 {t:'Where are you calling from?',s:'I’m calling from Las Vegas with Health Advisors. I’m reaching out regarding health coverage options.'},
 {t:'Wrong number',s:'That happens to me too! But since I have you on the line, let me quickly see what coverage options you might qualify for.'},
 {t:'Is it free?',s:'The licensed agent can explain the available plans, their premiums, and any costs based on your eligibility, location, and income.'},
 {t:'Question about benefits',s:'Great question. The licensed agent can explain that in detail.'},
 {t:'Where do benefits come from?',s:'Great question. The benefits depend on the specific plan and programs you qualify for. The licensed agent can explain the exact benefits and provider.'},
 {t:'Why do you need my age?',s:'Good question. Medicare benefits mostly start at 65, and the plans you can qualify for depend on your age. I just need to confirm it so I’m checking the right things for you.'},
 {t:'What are Parts A & B?',s:'Parts A and B together are Original Medicare. Part A helps cover hospital stays. Part B helps cover doctor visits, outpatient care and preventive services.'},
 {t:'What’s a licensed agent?',s:'A licensed agent has passed state exams and is approved to explain and enroll people in plans. I verify a few details first, then connect you with one.'},
 {t:'Take me off your list',s:'Absolutely. I’ll follow the required do-not-call procedure. Thank you for your time.',dnc:true}
];

const states={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'District of Columbia'};
const stateFull=()=>states[$('stateCode').value]||'';

// Render text with [Placeholders] highlighted yellow
function fillText(el,s){
  el.replaceChildren();
  s.split(/(\[[^\]]+\])/).forEach(part=>{
    if(!part)return;
    if(/^\[.+\]$/.test(part)){const sp=document.createElement('span');sp.className='fill';sp.textContent=(part==='[State]'&&stateFull())||part.slice(1,-1);el.appendChild(sp)}
    else el.appendChild(document.createTextNode(part));
  });
}

function pathInfo(){
  if(answers.dq)return{cls:'dq',label:'Not qualified',sub:answers.dq};
  if(answers.campaign)return{cls:'medicare',label:'VA/TRICARE',sub:'VA/TRICARE lead (use the VA/TRICARE campaign)'};
  if(answers.path==='Medicare')return{cls:'medicare',label:'Medicare',sub:'Medicare lead'};
  if(answers.path==='ACA')return{cls:'aca',label:'ACA',sub:'ACA lead'};
  return{cls:'',label:'Undetermined'};
}

function render(){
  const n=nodes[current];
  $('stage').textContent='Step '+n.step+' of 10';
  $('heading').textContent=v(n.title);
  $('stepCard').classList.toggle('rb',!!n.rb);
  $('stepCard').classList.toggle('dqc',!!n.dqc);
  fillText($('script'),v(n.say));
  const hint=v(n.hint);
  $('hint').textContent=hint;
  $('hint').classList.toggle('hidden',!hint);
  $('bar').style.width=(n.step*10)+'%';
  const p=pathInfo();
  $('path').textContent=p.label;
  $('path').className='pill '+p.cls;
  const ban=$('banner');
  if((n.banner&&p.cls)||n.dqc){
    ban.className='banner '+p.cls;
    ban.replaceChildren(document.createTextNode(p.cls==='dq'?'✕ NOT QUALIFIED':'✓ '+p.label.toUpperCase()+' TRANSFER'));
    const sm=document.createElement('small');sm.textContent=p.cls==='dq'?'Reason: '+p.sub:'Tell the agent: '+p.sub+(stateFull()?' from '+stateFull():'');ban.appendChild(sm);
  } else ban.className='banner hidden';
  const box=$('choices');box.replaceChildren();
  const ch=v(n.choices);
  ch.forEach(([label,next,set,style],i)=>{
    const b=document.createElement('button');
    b.className='btn'+(i===0?' primary':'')+(style?' '+style:'')+(ch.length===1?' wide':'');
    const k=document.createElement('span');k.className='n';k.textContent=i+1;
    b.append(k,document.createTextNode(label));
    b.addEventListener('click',()=>choose(next,set));
    box.appendChild(b);
  });
  $('back').disabled=!history.length;
}

function choose(next,set){
  if(next==='RESET'){reset();return}
  const target=typeof next==='function'?next(answers):next;
  const add=typeof set==='function'?set(answers):set;
  history.push({current,answers:{...answers}});
  if(add)Object.assign(answers,add);
  current=target;
  render();
}
function back(){if(!history.length)return;const h=history.pop();current=h.current;answers=h.answers;render()}
function reset(){
  current='opening';history=[];answers={};
  $('stateCode').value='';updateState();
  $('search').value='';closeRebuttal();
  render();
  window.scrollTo({top:0});
  const b=$('restart');b.textContent='✓ New call started';b.classList.add('flash');
  clearTimeout(reset.t);reset.t=setTimeout(()=>{b.textContent='↻ New call';b.classList.remove('flash')},1200);
}
function updateState(){
  const el=$('stateCode'),code=el.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,2);
  if(el.value!==code)el.value=code;
  const out=$('stateName'),full=states[code];
  out.textContent=full||(!code?'Type a 2-letter abbreviation':code.length<2?'Keep typing…':'Not a US state');
  out.classList.toggle('dim',!full);
}
$('stateCode').addEventListener('input',()=>{updateState();render()});
$('stateCode').addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')e.target.blur()});

// Objections
let activeObj=-1;
function renderObjections(){
  const q=$('search').value.trim().toLowerCase();
  const box=$('objections');box.replaceChildren();
  const list=objections.map((o,i)=>i).filter(i=>!q||(objections[i].t+' '+objections[i].s).toLowerCase().includes(q));
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No match.';box.appendChild(e);return list}
  list.forEach(i=>{
    const b=document.createElement('button');
    b.className='btn'+(i===activeObj?' on':'');
    b.textContent=objections[i].t;
    b.addEventListener('click',()=>showRebuttal(i));
    box.appendChild(b);
  });
  return list;
}
function showRebuttal(i){
  const o=objections[i];activeObj=i;
  $('rbTitle').textContent='Customer: '+o.t;
  fillText($('rbSay'),'“'+o.s+'”');
  $('rbFlag').textContent='Mark DNC in ConvoSo now.';
  $('rbFlag').classList.toggle('hidden',!o.dnc);
  $('rbPivot').textContent=o.dnc?'Do not continue the conversation. End the call.':(o.pivot||'Then go back to script: '+PIVOT);
  $('rebuttal').classList.remove('hidden');
  renderObjections();
  if(window.matchMedia('(max-width:820px)').matches)$('rebuttal').scrollIntoView({block:'start'});
}
function closeRebuttal(){activeObj=-1;$('rebuttal').classList.add('hidden');renderObjections()}

$('back').onclick=back;
$('restart').onclick=reset;
$('closeRebuttal').onclick=closeRebuttal;
$('search').addEventListener('input',renderObjections);
$('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const l=renderObjections();if(l.length)showRebuttal(l[0]);e.preventDefault()}
  if(e.key==='Escape'){$('search').value='';renderObjections();$('search').blur()}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-9]$/.test(e.key)){const b=$('choices').children[+e.key-1];if(b){b.click();e.preventDefault()}}
  else if(e.key==='Backspace'){back();e.preventDefault()}
  else if(e.key==='Escape')closeRebuttal();
  else if(e.key==='/'){$('search').focus();e.preventDefault()}
});

renderObjections();
render();
})();
</script>
</body>
</html>
